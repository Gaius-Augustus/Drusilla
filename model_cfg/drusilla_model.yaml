# Drusilla model manifest: the released Drusilla model (one model for all clades).
#
# The weights ship inside the repository and the wheel. weights_path and arch_path
# are relative to the directory that holds model_cfg/ (the repository root in a
# checkout, drusilla/_bundled/ in an installed wheel); nothing is downloaded.
# weights_sha256 is the SHA256 of the weights file and is checked on every use.
#
# Field reference:
#   name                identifier (must match the filename stem)
#   version             string, shown by `drusilla models list`; bump it with new weights
#   target_clade        free-text clade label (informational)
#   ncbi_tax_id         NCBI taxonomy id of the clade (informational)
#   weights_path        bundled Keras weights file
#   arch_path           bundled architecture / data config (build_model_from_config)
#   weights_sha256      SHA256 of the weights file; checked on every use
#   training_run        training run the weights come from
#   drusilla_version    minimum drusilla version this release was tested with
#   default_chunk_len   chunk_len the weights were trained with (informational)
#   date                YYYY-MM-DD release date
#   architecture        informational; the real architecture is in arch_path
#   label_policy        label policy of the training data (docs/data_prep.md)
#   comment             free text, shown by `drusilla models list`
#   annotate_defaults   inference options preset for `drusilla annotate`
#                       (command-line values win; see docs/annotate.md)
#   validation_species, training_species
#                       species lists (informational, see the note above them)
# A downloaded model names a .tar.gz archive in weights_url instead of
# weights_path / arch_path (see model_cfg/README.md).

name: drusilla_model
version: "1.0"
target_clade: "Eukaryota: vertebrates, insects, embryophyta, fungi, diatoms, chlorophyta"
ncbi_tax_id: 2759
weights_path: models/drusilla_model/model.weights.h5
arch_path: configs/drusilla_model.yaml
weights_sha256: "8adae611a4e3c3a556db58dc167e6d443f530c048b75d89e8ad76bc8c066b9f0"   # of model.weights.h5
# model.weights.h5 = epoch_73.weights.h5 of training run cnn_lstm_joint_run001 (tiberius_orf_finder,
# md5 e1cf5847b168831594083198f81785be): the last epoch of the chain (73 epochs, two 12 h jobs, LR
# halved six times to 1.6e-6; val_loss flat since epoch 42; best of epochs 42/59/61/73 on the
# one-species-per-clade test benchmark, decided 2026-11-04).
training_run: "cnn_lstm_joint_run001"
drusilla_version: "0.3.0"
default_chunk_len: 9999
date: "2026-11-04"
architecture: "cnn_lstm"
label_policy: "v2"   # both orientations of unstranded transcripts, every non-overlapping CDS per transcript,
                     # RefSeq partial=true / pseudo=true CDS treated as incomplete (docs/data_prep.md)
comment: >-
  The Drusilla model: one CNN-BiLSTM for all clades, trained on the pooled label-policy-v2 TFRecords of
  425 species (68 vertebrates, 88 insects, 32 embryophyta, 213 fungi, 18 diatoms, 6 chlorophyta) with
  configs/drusilla_model.yaml; validated on Ornithorhynchus anatinus, Petromyzon marinus, Drosophila
  ananassae, Drosophila virilis, Tenebrio molitor, Populus trichocarpa. Default model since Drusilla 0.3.

# Inference options that match the training labels (policy v2) and the
# genomic-flank ORF completion used in the test benchmarks of all clades.
# Each can be overridden on the command line (--no-unstranded-both-strands,
# --unstranded-pick longest, --orfs-per-tx 1, --flank-bp 0 ...).
annotate_defaults:
  unstranded_both_strands: true
  unstranded_pick: nonoverlap
  orfs_per_tx: 0
  flank_bp: 500
  flank_3p_bp: 500
  flank_keep: true

# validation_species / training_species: the comment after each species is
# its genome assembly as listed in the species CSVs of tiberius_orf_finder
# (nextflow/conf/), from which the TFRecords were built: an NCBI accession,
# or "Phytozome <id>" for a genome from Phytozome.
