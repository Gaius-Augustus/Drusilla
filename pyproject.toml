[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drusilla"
version = "0.3.0"
authors = [
  { name = "Lars Gabriel", email = "lars.gabriel@uni-greifswald.de" },
]
description = "Deep-learning ORF annotator for RNA-seq assembled transcripts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["bioinformatics", "gene-prediction", "orf", "annotation", "rna-seq"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "pyyaml",
  "numpy",
  "pyfaidx",
]

[project.optional-dependencies]
gpu = [
  "tensorflow[and-cuda]>=2.17,<2.20",
  "bricks2marble[tf]",
  "hidten",
  "biopython",
  "pandas",
  "pysam",
]
bam = ["pysam"]
test = ["pytest"]

[project.scripts]
drusilla = "drusilla.cli:main"

[project.urls]
Homepage = "https://github.com/Gaius-Augustus/Drusilla"
Issues = "https://github.com/Gaius-Augustus/Drusilla/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/drusilla"]

[tool.hatch.build.targets.wheel.force-include]
# The whole manifest directory ships with the wheel: the registry globs
# *.yaml there, so new models reach pip / container installs without edits.
"model_cfg"                  = "drusilla/_bundled/model_cfg"
"configs/default.yaml"       = "drusilla/_bundled/configs/default.yaml"
"configs/vertebrates.yaml"   = "drusilla/_bundled/configs/vertebrates.yaml"
"configs/joint.yaml"         = "drusilla/_bundled/configs/joint.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
